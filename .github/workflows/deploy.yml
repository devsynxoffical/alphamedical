name: Build & deploy to FTP

on:
  push:
    branches: [main]
  workflow_dispatch: # allows a manual "Run workflow" button in the Actions tab

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: sitemap.xml <lastmod> is taken from git

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (client + prerender + sitemap + llms.txt)
        run: npm run build
        env:
          # URL of the form/mail API (server.js). Set it under
          # Settings > Secrets and variables > Actions > Variables.
          VITE_MAIL_API_URL: ${{ vars.VITE_MAIL_API_URL }}

      - name: Check build output
        run: |
          test -f dist/index.html
          test -f dist/sitemap.xml
          test -f dist/llms.txt
          ls -la dist

      - name: Check FTP server is reachable
        run: |
          getent hosts ftp.alphamediassist.com
          timeout 15 bash -c "exec 3<>/dev/tcp/ftp.alphamediassist.com/21 && timeout 5 head -c 80 <&3" && echo && echo "FTP port 21 reachable"

      - name: List FTP folders (find web root)
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          for d in "" "public_html/" "www/" "htdocs/" "alphamediassist.com/" "public_html/alphamediassist.com/"; do
            echo "=== /$d ==="
            curl -s --ssl-reqd --list-only --max-time 20 -u "$FTP_USER:$FTP_PASS" "ftp://ftp.alphamediassist.com/$d" | sort | head -40 || echo "(not found)"
          done
          echo "=== PWD ==="
          curl -s --ssl-reqd --max-time 20 -u "$FTP_USER:$FTP_PASS" "ftp://ftp.alphamediassist.com/" -Q "PWD" -o /dev/null -v 2>&1 | grep -i '257' || true

      - name: Upload to server (FTPS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          # Verified host: ftp.alphamediassist.com (209.42.21.37, Pure-FTPd with TLS).
          # Not a secret; ftp.alphaahead.com points to parking servers and does not work.
          server: ftp.alphamediassist.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps # explicit FTPS on port 21 (encrypted)
          timeout: 120000 # ms; shared hosts can be slow to answer
          log-level: verbose
          local-dir: ./frontend/dist/
          # Folder on the server that the domain serves. Must end with "/".
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Verify live site
        run: |
          sleep 5
          B=https://www.alphamediassist.com
          fail=0
          check() { code=$(curl -s -o /tmp/body -w '%{http_code}' "$B$1"); echo "$1 -> HTTP $code"; [ "$code" = "$2" ] || fail=1; }
          check / 200
          check /medical-billing-services 200
          check /medical-billing-services-florida 200
          check /blog/how-much-does-medical-billing-cost 200
          check /sitemap.xml 200
          check /llms.txt 200
          check /robots.txt 200
          check /c89d9636854147c59b95ff08cb40c0e8.txt 200
          check /this-page-does-not-exist 404
          echo "--- redirect /about ---"; curl -s -o /dev/null -w '%{http_code} -> %{redirect_url}\n' "$B/about"
          echo "--- prerendered content check ---"
          curl -s "$B/medical-billing-services" | grep -o '<h1[^>]*>[^<]*' | head -1 || fail=1
          curl -s "$B/" | grep -c 'google-site-verification' || fail=1
          curl -s "$B/" | grep -o '<link data-seo rel="canonical"[^>]*>' || fail=1
          exit $fail
