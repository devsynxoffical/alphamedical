name: Build & deploy to FTP

on:
  push:
    branches: [main]
  workflow_dispatch: # allows a manual "Run workflow" button in the Actions tab

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: sitemap.xml <lastmod> is taken from git

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (client + prerender + sitemap + llms.txt)
        run: npm run build
        env:
          # URL of the form/mail API (server.js). Set it under
          # Settings > Secrets and variables > Actions > Variables.
          VITE_MAIL_API_URL: ${{ vars.VITE_MAIL_API_URL }}

      - name: Check build output
        run: |
          test -f dist/index.html
          test -f dist/sitemap.xml
          test -f dist/llms.txt
          ls -la dist

      - name: Diagnose FTP connectivity
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          echo "Secret length: ${#FTP_SERVER} characters (expected 18 for ftp.alphaahead.com)"
          [ "$FTP_SERVER" = "ftp.alphaahead.com" ] && echo "FTP_SERVER matches ftp.alphaahead.com" || echo "WARNING: FTP_SERVER is not exactly 'ftp.alphaahead.com' (check for spaces, ftp:// prefix or typos)"
          echo "--- DNS ---"
          getent hosts "$FTP_SERVER" || echo "DNS lookup FAILED"
          getent hosts ftp.alphaahead.com || echo "DNS lookup for ftp.alphaahead.com FAILED"
          echo "--- TCP port 21 (15s) ---"
          timeout 15 bash -c "exec 3<>/dev/tcp/ftp.alphaahead.com/21 && timeout 5 head -c 200 <&3" && echo "PORT 21 REACHABLE" || echo "PORT 21 NOT REACHABLE from GitHub (firewall/blocked or FTP not running)"
          echo "--- TCP port 22 (SFTP, 10s) ---"
          timeout 10 bash -c "exec 3<>/dev/tcp/ftp.alphaahead.com/22 && timeout 5 head -c 100 <&3" && echo "PORT 22 REACHABLE" || echo "port 22 not reachable"

      - name: Upload to server (FTPS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps # explicit FTPS on port 21 (encrypted)
          timeout: 120000 # ms; shared hosts can be slow to answer
          log-level: verbose
          local-dir: ./frontend/dist/
          # Folder on the server that the domain serves. Must end with "/".
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
